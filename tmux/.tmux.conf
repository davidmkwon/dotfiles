# Remove SSH_AUTH_SOCK to disable tmux automatically resetting the variable
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
# Use a symlink to look up SSH authentication
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

# remap the prefix
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# add mouse and color
set -g default-terminal "screen-256color"

# switching windows
bind -r h previous-window
bind -r l next-window
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# bar thing at the bottom
set -g status-position bottom
set -g status-left ''
set -g status-right 'tmux'
set -g status-right-length 50
set -g status-left-length 20
setw -g mode-keys vi

# Original dark status theme (uncomment to restore)
# set -g status-style 'bg=colour234,fg=colour137'
# set -g status-bg colour234
# set -g status-fg colour137
# setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
# setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Custom colour214 and colour106 status theme
#set -g status-style 'bg=colour214,fg=colour235'
set -g status-style 'bg=colour214,fg=colour235'
set -g status-bg colour214
set -g status-fg colour235
# Active window: colour106 background with dark text
setw -g window-status-current-format '#[bg=colour106,fg=colour235,bold] #I#[fg=colour237]:#[fg=colour235]#W#[fg=colour237]#F #[bg=colour214,fg=colour235,nobold]'
# Inactive windows: colour214 background with dark text
setw -g window-status-format '#[bg=colour214,fg=colour235,nobold] #I#[fg=colour239]:#[fg=colour235]#W#[fg=colour237]#F '
setw -g window-status-separator '#[bg=colour214,fg=colour235,nobold] '

set-option -g renumber-windows on

# history length
set-option -g history-limit 5000

# no escape delay for vim
set -s escape-time 0

#set -g default-path
#set-option -g default-command "exec /bin/bash"
set-option -g repeat-time 0 # so that tmux commands have no delay

# make tmux use zsh
set-option -g default-shell /bin/zsh

# bindings to resize panes
bind-key -r + resize-pane -U
bind-key -r - resize-pane -D
bind-key -r S-Left resize-pane -L
bind-key -r S-Right resize-pane -R

# use y to yank to clipboard
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# pane movement
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

bind-key b choose-tree -wZ

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
